      chance: 0.3
      amount: "1-3"
  # Named monsters. Each zone lists which of these can spawn there.
  # Fields: displayName, entityType, scale, speed (multiplier), hpMult,
  # valueMult, xp, miniBoss (boss bar + bonus), icon (collection menu),
  # and an optional drops table overriding mob.drops.
