          material: BONE
          chance: 0.4
          amount: "1-2"
    trash_zombie:
      displayName: "&cTrash Zombie"
      entityType: ZOMBIE
      icon: ZOMBIE_HEAD
      scale: 1.0
      speed: 1.0
      hpMult: 1.0
      valueMult: 1.0
      xp: 10
      miniBoss: false
    toxic_spider:
