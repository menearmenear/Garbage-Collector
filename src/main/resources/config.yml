    cost: 2500

recycling:
  # /recycle (or /shop -> Recycling) converts bag garbage into recycled
  # materials. Amount: how many pieces of that garbage = 1 material unit.
  recipes:
    paper:
      material: PAPER
      amount: 10
    newspaper:
      material: PAPER
      amount: 8
    plastic_chunk:
      material: GLASS
      amount: 8
    plastic_bottle:
      material: GLASS
      amount: 6
    can:
      material: IRON_INGOT
      amount: 6
    scrap:
      material: IRON_INGOT
      amount: 4
    bottle:
      material: GLASS
      amount: 5
    electronics:
      material: GOLD_INGOT
      amount: 4
    battery:
      material: REDSTONE
      amount: 3
    oil_barrel:
      material: IRON_INGOT
      amount: 8
    fishing_junk:
      material: STRING
      amount: 6

sell:
  # Money earned per garbage unit of each base type after rarity multiplier
  alwaysBonusChance: 0.1
  # Bonus loot table; chance rolled per sell (0-1), material, amount "min-max"
  bonusLoot:
    - material: DIAMOND
      chance: 0.02
      amount: "1-1"
    - material: EMERALD
      chance: 0.05
      amount: "1-2"
    - material: GOLD_INGOT
      chance: 0.08
      amount: "1-3"
    - material: BONE
      chance: 0.2
      amount: "1-4"

tool:
