# ===========================================================
#  Garbage Collector - configuration
#  Run /garbage reload for most changes.
#  Interval changes need a server restart.
#  The plugin auto-merges any missing options into an older
#  config.yml on startup (your tweaks are kept).
# ===========================================================

# Version of this config. When the plugin ships a higher version,
# the missing options are merged in automatically on startup.
config-version: 3

spawn:
  # Interval in seconds between spawn ticks
  intervalSeconds: 10
  # World to spawn in (when spawning at world spawn)
  world: world
  # Radius around world spawn for random spawns
  spawnRadius: 30
  # Mode: "spawn" | "players" | "mixed"
  mode: mixed
  # Chance (0-100) the spawn targets a random player
  playerChance: 60
  # Radius around a player when spawning near them
  playerRadius: 12
  # Chance (0-100) a spawn is a trash monster mob
  mobChance: 15
  # Chance (0-100) that a monster spawn is the zone's mini-boss (0.5 = 0.5%)
  miniBossChance: 0.5
  # Radius for the /garbage spawn spread (blocks)
  burstSpread: 20

collect:
  # Hold-to-collect: you must keep interacting (right-click/hold) for
  # this long to pick garbage up. Shown as a progress bar in the action bar.
  baseHoldMillis: 3000
  minHoldMillis: 400
  # Each efficiency point (Efficiency upgrade + legacy Quick Hands/Cooldown
  # purchases + tool bonus) lowers the required hold time by this much
  holdReductionPerLevel: 400
  # Max gap between interactions before the hold progress resets
  holdMaxGapMillis: 1500
  # Post-collect cooldown between successful pickups (anti-click-spam)
  baseCooldownMillis: 2000
  minCooldownMillis: 300
  # Each efficiency point lowers the cooldown by this much
  cooldownReductionPerLevel: 350

garbage:
  # Seconds garbage stays before despawning (0 = never)
  ttlSeconds: 120
  # Permanent luck gained every time a Mythic piece is collected
  mythicLuckReward: 1
  # Collector tiers: higher tier = more value & more bag capacity
  # tiers are named "tier1", "tier2", ...
  collector:
    tier1:
      valueMultiplier: 1.0
      bagCapacity: 20
      cost: 0
    tier2:
      valueMultiplier: 1.5
      bagCapacity: 40
      cost: 500
    tier3:
      valueMultiplier: 2.5
      bagCapacity: 80
      cost: 2000
    tier4:
      valueMultiplier: 4.0
      bagCapacity: 150
      cost: 8000
  rarities:
    common:
      weight: 70
      color: "#FFFFFF"
      glow: WHITE
      xp: 1
      valueMultiplier: 1.0
    rare:
      weight: 20
      color: "#00E5FF"
      glow: LIGHT_BLUE
      xp: 3
      valueMultiplier: 3.0
    epic:
      weight: 8
      color: "#FF58FE"
      glow: MAGENTA
      xp: 8
      valueMultiplier: 8.0
    legendary:
      weight: 2
      color: "#FFB400"
      glow: ORANGE
      xp: 20
      valueMultiplier: 25.0
    # Mythic: super rare. weight 0 = never picked globally; zones add a
    # weight to opt in. On collect it broadcasts, gives +1 permanent luck
    # (garbage.mythicLuckReward) and requires collection.
    mythic:
      weight: 0
      color: "#AA00FF"
      glow: PURPLE
      xp: 100
      valueMultiplier: 100.0
      mythic: true
  types:
    paper:
      material: PAPER
      value: 1
    newspaper:
      material: BOOK
      value: 3
    can:
      material: IRON_NUGGET
      value: 3
    bottle:
      material: GLASS_BOTTLE
      value: 2
    plastic_bottle:
      material: GLASS_BOTTLE
      value: 5
    plastic_chunk:
      material: GLASS
      value: 2
    sock:
      material: LEATHER
      value: 1
    scrap:
      material: IRON_NUGGET
      value: 4
    oil_barrel:
      material: BUCKET
      value: 12
    battery:
      material: REDSTONE
      value: 50
      requiresPower: 2
    electronics:
      material: REPEATER
      value: 80
      requiresPower: 3
    broken_phone:
      material: CLOCK
      value: 250
      requiresPower: 4
    old_laptop:
      material: NETHERITE_SCRAP
      value: 1200
      requiresPower: 6
    toxic_waste:
      material: SLIME_BALL
      value: 150
      requiresPower: 3
    fishing_junk:
      material: STRING
      value: 6
    e_waste:
      material: OBSERVER
      value: 200
      requiresPower: 4
    nuclear_waste:
      material: GREEN_DYE
      value: 400
      requiresPower: 6
    teddy_bear:
      material: BROWN_WOOL
      value: 50
      collectible: true
    ancient_coin:
      material: GOLD_NUGGET
      value: 10000
    lost_jewelry:
      material: EMERALD
      value: 5000
      requiresPower: 5

collectorLevels:
  maxLevel: 50
  # XP needed to reach level N = perLevelBase + (N-1) * perLevelGrowth,
  # cumulative. Levels unlock zones, upgrades and garbage.
  perLevelBase: 100
  perLevelGrowth: 50

luck:
  enabled: true
  moneyBonusPerPoint: 0.02
  xpBonusPerPoint: 0.03
  # Each collect has this chance (0-1) to gain luck
  gainOnCollectChance: 0.05
  gainAmount: 1
  maxLuck: 100
  # Upgrade price per luck point in the shop
  upgradeCostPerPoint: 50
  upgradeMaxPerPurchase: 5

backpacks:
  # Total bag capacity = collector tier's bagCapacity x capacityMult.
  # Higher backpacks give much more room.
  levels:
    1:
      displayName: "&7Small Sack"
      icon: LEATHER_BOOTS
      capacityMult: 1.0
      cost: 0
    2:
      displayName: "&fGarbage Bag"
      icon: PAPER
      capacityMult: 2.0
      cost: 1500
    3:
      displayName: "&8Dumpster Bag"
      icon: COBBLESTONE
      capacityMult: 5.0
      cost: 6000
    4:
      displayName: "&6Industrial Container"
      icon: BARREL
      capacityMult: 12.0
      cost: 25000
    5:
      displayName: "&cTrash Compactor"
      icon: IRON_TRAPDOOR
      capacityMult: 30.0
      cost: 100000

tools:
  # Better Grabbers: flat bonuses added to your collector machine.
  # They can be bought with money + recycled materials (keys of recycling
  # output materials) or just money.
  order:
    - basic
    - steel
    - electric
    - industrial
    - quantum
  basic:
    displayName: "&fBasic Grabber"
    icon: STICK
    cost: 0
    power: 0
    efficiency: 0
    luck: 0
    magnet: 0
  steel:
    displayName: "&7Steel Grabber"
    icon: IRON_INGOT
    cost: 1500
    materials:
      paper: 5
    power: 0
    efficiency: 2
    luck: 0
    magnet: 0
  electric:
    displayName: "&dElectric Grabber"
    icon: GLOWSTONE_DUST
    cost: 8000
    materials:
      can: 10
      bottle: 10
    power: 0
    efficiency: 1
    luck: 2
    magnet: 3
  industrial:
    displayName: "&cIndustrial Grabber"
    icon: ANVIL
    cost: 25000
    materials:
      electronics: 8
      battery: 10
    power: 4
    efficiency: 2
    luck: 3
    magnet: 1
  quantum:
    displayName: "&bQuantum Grabber"
    icon: NETHER_STAR
    cost: 100000
    materials:
      nuclear_waste: 4
      lost_jewelry: 1
    power: 6
    efficiency: 4
    luck: 10
    magnet: 3

shop:
  # Movement speed upgrade
  speed:
    enabled: true
    levels:
      1:
        walkSpeed: 0.2
        cost: 0
      2:
        walkSpeed: 0.22
        cost: 300
      3:
        walkSpeed: 0.25
        cost: 800
      4:
        walkSpeed: 0.3
        cost: 2000
  # Power: lets you collect/heavier garbage (types requiring power)
  power:
    enabled: true
    levels:
      1:
        cost: 800
      2:
        cost: 2000
      3:
        cost: 5000
      4:
        cost: 15000
      5:
        cost: 40000
      6:
        cost: 100000
  # Efficiency: reduces hold-to-collect time and the pickup cooldown
  efficiency:
    enabled: true
    levels:
      1:
        cost: 600
      2:
        cost: 1500
      3:
        cost: 3500
      4:
        cost: 8000
      5:
        cost: 18000
  # Magnet: auto-collects the nearest garbage within a radius every
  # cooldownSeconds while you are online. Higher levels = wider radius
  # and a much shorter cooldown.
  magnet:
    enabled: true
    levels:
      1:
        radius: 3
        cooldownSeconds: 60
        cost: 1000
      2:
        radius: 4
        cooldownSeconds: 45
        cost: 2500
      3:
        radius: 5
        cooldownSeconds: 30
        cost: 4500
      4:
        radius: 7
        cooldownSeconds: 20
        cost: 8000
      5:
        radius: 9
        cooldownSeconds: 10
        cost: 14000

powerups:
  # Temporary boosts you buy in /shop -> Powerups. Expire after
  # durationSeconds. Each powerup is applied while active.
  speed:
    displayName: "&eSpeed Boost"
    icon: SUGAR
    durationSeconds: 60
    cost: 1000
    walkSpeedMult: 1.5
  luck:
    displayName: "&dLucky Hour"
    icon: EXPERIENCE_BOTTLE
    durationSeconds: 60
    cost: 1500
    luckBonus: 25
  magnet:
    displayName: "&9Mega Magnet"
    icon: COMPASS
    durationSeconds: 30
    cost: 2000
    radiusMult: 3.0
  golden:
