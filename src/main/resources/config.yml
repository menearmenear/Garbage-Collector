# ===========================================================
#  Garbage Collector - configuration
#  Run /garbage reload for most changes.
#  Interval changes need a server restart.
# ===========================================================

spawn:
  # Interval in seconds between spawn ticks
  intervalSeconds: 10
  # World to spawn in (when spawning at world spawn)
  world: world
  # Radius around world spawn for random spawns
  spawnRadius: 30
  # Mode: "spawn" | "players" | "mixed"
  mode: mixed
  # Chance (0-100) the spawn targets a random player
  playerChance: 60
  # Radius around a player when spawning near them
  playerRadius: 12
  # Chance (0-100) a spawn is a trash monster mob
  mobChance: 15
  # Radius for the /garbage spawn spread (blocks)
  burstSpread: 20

garbage:
  # Seconds garbage stays before despawning (0 = never)
  ttlSeconds: 120
  # Collector tiers: higher tier = more value & more bag capacity
  # tiers are named "tier1", "tier2", ...
  collector:
    tier1:
      valueMultiplier: 1.0
      bagCapacity: 20
      cost: 0
    tier2:
      valueMultiplier: 1.5
      bagCapacity: 40
      cost: 500
    tier3:
      valueMultiplier: 2.5
      bagCapacity: 80
      cost: 2000
    tier4:
      valueMultiplier: 4.0
      bagCapacity: 150
      cost: 8000
  rarities:
    common:
      weight: 70
      color: "#FFFFFF"
      glow: WHITE
      xp: 1
      valueMultiplier: 1.0
    rare:
      weight: 20
      color: "#00E5FF"
      glow: LIGHT_BLUE
      xp: 3
      valueMultiplier: 3.0
    epic:
      weight: 8
      color: "#FF58FE"
      glow: MAGENTA
      xp: 8
      valueMultiplier: 8.0
    legendary:
      weight: 2
      color: "#FFB400"
      glow: ORANGE
      xp: 20
      valueMultiplier: 25.0
  types:
    paper:
      material: PAPER
      value: 1
    can:
      material: IRON_NUGGET
      value: 3
    bottle:
      material: GLASS_BOTTLE
      value: 2
    sock:
      material: LEATHER
      value: 1
    diamond:
      material: DIAMOND
      value: 10

luck:
  enabled: true
  moneyBonusPerPoint: 0.02
  xpBonusPerPoint: 0.03
  # Each collect has this chance (0-1) to gain luck
  gainOnCollectChance: 0.05
  gainAmount: 1
  maxLuck: 100
  # Upgrade price per luck point in the shop
  upgradeCostPerPoint: 50
  upgradeMaxPerPurchase: 5

shop:
  # Movement speed upgrade
  speed:
    enabled: true
    levels:
      1:
        walkSpeed: 0.2
        cost: 0
      2:
        walkSpeed: 0.22
        cost: 300
      3:
        walkSpeed: 0.25
        cost: 800
      4:
        walkSpeed: 0.3
        cost: 2000

sell:
  # Money earned per garbage unit of each base type after rarity multiplier
  alwaysBonusChance: 0.1
  # Bonus loot table; chance rolled per sell (0-1), material, amount "min-max"
  bonusLoot:
    - material: DIAMOND
      chance: 0.02
      amount: "1-1"
    - material: EMERALD
      chance: 0.05
      amount: "1-2"
    - material: GOLD_INGOT
      chance: 0.08
      amount: "1-3"
    - material: BONE
      chance: 0.2
      amount: "1-4"

tool:
  material: STICK
  name: "&6Trash Grabber"
  lore:
    - "&7Right-click garbage to collect it"
    - "&7Sell your haul with &b/sell"
    - "&7Upgrade this collector with &b/shop"

mob:
  name: "&cTrash Monster"
  type: ZOMBIE
  # Highest tier garbage mobs can spawn with (I, II, III, IV, V)
  maxTier: 5
  # +% health per extra tier
  healthPerTier: 1.5
  # +% drop value per extra tier (scales the spawned garbage value)
  valuePerTier: 1.5
  # Bonus loot table on kill
  luckDropChanceBonusPerPoint: 0.01
  drops:
    bone:
      material: BONE
      chance: 0.2
      amount: "1-4"
    rotten:
      material: ROTTEN_FLESH
      chance: 0.3
      amount: "1-3"

effects:
  particles: true
  sounds: true

scoreboard:
  title: "&6Garbage Collector"
  lines:
    - "&7Money: &f$%money%"
    - "&7Collected: &f%collected%"
    - "&7Luck: &f%luck%"
    - "&7Tier: &f%tier%"

admin:
  permission: garbage.admin