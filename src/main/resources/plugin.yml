name: Garbage-Collector
main: com.menear.garbagecollector.GarbageCollectorPlugin
version: 0.1.0
api-version: 1.20
author: menearmenear

commands:
  garbage:
    description: Garbage plugin admin commands
    usage: /<command> <subcommand>
    permission: garbage.admin
  garbageitem:
    description: Get your garbage collector item
    usage: /<command>
  sell:
    description: Open the sell GUI
    usage: /<command>
  shop:
    description: Open the upgrade shop
    usage: /<command>
  collection:
    description: Open your garbage collection
    usage: /<command>
  recycle:
    description: Turn bag garbage into recycled materials
    usage: /<command>
  zone:
    description: View and travel to garbage zones
    usage: /<command>
  missions:
    description: View your daily contracts
    usage: /<command>
  achievements:
    description: View your achievements
    usage: /<command>
  leaderboard:
    description: View the top players
    usage: /<command>